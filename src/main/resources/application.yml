server:
  port: ${SERVER_PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:localDevelopmentJwtSecretThatIsAtLeast32CharactersLong}

azure:
  storage:
    container-name: ${AZURE_STORAGE_CONTAINER_NAME:medvision}
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:UseDevelopmentStorage=true}

local:
  storage:
    directory: ${LOCAL_STORAGE_DIRECTORY:local_images}

medvision:
  svm:
    preload-enabled: ${MEDVISION_SVM_PRELOAD_ENABLED:true}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:always}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:INFO}
