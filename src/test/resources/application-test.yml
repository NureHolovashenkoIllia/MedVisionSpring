spring:
  datasource:
    url: jdbc:h2:mem:medvision-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: localhost
    port: 2525
    username:
    password:

jwt:
  secret: testJwtSecretThatIsAtLeastThirtyTwoCharactersLong

azure:
  storage:
    container-name: medvision-test
    connection-string: UseDevelopmentStorage=true

local:
  storage:
    directory: target/test-storage

medvision:
  svm:
    preload-enabled: false

logging:
  level:
    root: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
